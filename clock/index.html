<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Valós idejű budapesti analóg óra az Európa/Budapest időzónában, magyar nyelvű dátummal, napkelte/napnyugta adatokkal és sötét/világos témával.">
  <title>Budapesti idő · Európa/Budapest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='%23fbbf24'/%3E%3C/svg%3E">
  <script>
    (() => {
      const key = 'budapest-clock-theme';
      let stored = null;
      try {
        stored = window.localStorage.getItem(key);
      } catch (error) {
        stored = null;
      }
      const prefersLight = window.matchMedia
        ? window.matchMedia('(prefers-color-scheme: light)').matches
        : false;
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (prefersLight ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', theme === 'light' ? '#f4f1ea' : '#05070d');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070d;
      --glow-a: rgba(63, 94, 217, 0.20);
      --glow-b: rgba(245, 158, 11, 0.12);
      --text: #f8fafc;
      --soft: #cbd5e1;
      --muted: #93a1b5;
      --faint: #7c8aa0;
      --gold: #fbbf24;
      --gold-soft: #fcd34d;
      --gold-rgb: 251, 191, 36;
      --border: rgba(255, 255, 255, 0.09);
      --border-soft: rgba(255, 255, 255, 0.06);
      --grid-line: rgba(255, 255, 255, 0.028);
      --card-top: rgba(255, 255, 255, 0.065);
      --card-bottom: rgba(255, 255, 255, 0.018);
      --card-shadow: 0 40px 90px -32px rgba(0, 0, 0, 0.85);
      --card-inset: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      --eyebrow-bg: rgba(255, 255, 255, 0.03);
      --eyebrow-border: rgba(255, 255, 255, 0.10);
      --button-bg: rgba(255, 255, 255, 0.04);
      --button-border: rgba(255, 255, 255, 0.12);
      --button-hover: rgba(255, 255, 255, 0.09);
      --button-icon: #f8fafc;
      --dial-bg: radial-gradient(circle at 50% 33%, #141b2b 0%, #0a0f18 58%, #060911 100%);
      --dial-face: #0a0f18;
      --dial-border: rgba(255, 255, 255, 0.10);
      --dial-highlight: rgba(255, 255, 255, 0.06);
      --dial-shadow: 0 34px 70px -30px rgba(0, 0, 0, 0.9);
      --dial-tick: rgba(255, 255, 255, 0.22);
      --dial-tick-hour: rgba(255, 255, 255, 0.55);
      --dial-number: #a9b6c8;
      --dial-hand: #f8fafc;
      --dial-second: var(--gold);
      --dial-pin: var(--gold);
      --dial-pin-inner: #0a0f18;
      --zone-border: rgba(var(--gold-rgb), 0.22);
      --zone-bg: rgba(var(--gold-rgb), 0.07);
      --stat-label: #8fa0b8;
      --stat-bg: rgba(255, 255, 255, 0.03);
      --stat-border: rgba(255, 255, 255, 0.06);
      --meta-border: rgba(255, 255, 255, 0.07);
      --strong-text: #c3cede;
      --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", ui-monospace, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f1ea;
      --glow-a: rgba(63, 94, 217, 0.10);
      --glow-b: rgba(245, 158, 11, 0.16);
      --text: #0f172a;
      --soft: #334155;
      --muted: #5b6b82;
      --faint: #5f6f86;
      --gold: #b45309;
      --gold-soft: #92400e;
      --gold-rgb: 180, 83, 9;
      --border: rgba(15, 23, 42, 0.10);
      --border-soft: rgba(15, 23, 42, 0.08);
      --grid-line: rgba(15, 23, 42, 0.045);
      --card-top: rgba(255, 255, 255, 0.82);
      --card-bottom: rgba(255, 255, 255, 0.58);
      --card-shadow: 0 40px 90px -36px rgba(15, 23, 42, 0.32);
      --card-inset: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --eyebrow-bg: rgba(255, 255, 255, 0.55);
      --eyebrow-border: rgba(15, 23, 42, 0.10);
      --button-bg: rgba(255, 255, 255, 0.65);
      --button-border: rgba(15, 23, 42, 0.12);
      --button-hover: rgba(15, 23, 42, 0.06);
      --button-icon: #334155;
      --dial-bg: radial-gradient(circle at 50% 32%, #ffffff 0%, #fbf8f2 58%, #f2ede3 100%);
      --dial-face: #fbf8f2;
      --dial-border: rgba(15, 23, 42, 0.10);
      --dial-highlight: rgba(255, 255, 255, 0.9);
      --dial-shadow: 0 34px 70px -34px rgba(15, 23, 42, 0.28);
      --dial-tick: rgba(15, 23, 42, 0.18);
      --dial-tick-hour: rgba(15, 23, 42, 0.5);
      --dial-number: #475569;
      --dial-hand: #0f172a;
      --dial-second: var(--gold);
      --dial-pin: var(--gold);
      --dial-pin-inner: #fbf8f2;
      --zone-border: rgba(var(--gold-rgb), 0.28);
      --zone-bg: rgba(var(--gold-rgb), 0.08);
      --stat-label: #5b6b82;
      --stat-bg: rgba(255, 255, 255, 0.55);
      --stat-border: rgba(15, 23, 42, 0.08);
      --meta-border: rgba(15, 23, 42, 0.08);
      --strong-text: #334155;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 2.5rem);
      overflow-x: hidden;
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(60vmax 60vmax at 12% 8%, var(--glow-a), transparent 62%),
        radial-gradient(52vmax 52vmax at 92% 94%, var(--glow-b), transparent 64%),
        var(--bg);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 78% 66% at 50% 44%, #000 15%, transparent 74%);
      mask-image: radial-gradient(ellipse 78% 66% at 50% 44%, #000 15%, transparent 74%);
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .card {
      position: relative;
      width: min(100%, 690px);
      padding: clamp(1.4rem, 4.5vw, 2.8rem) clamp(1.2rem, 5vw, 3.25rem) clamp(1.3rem, 4vw, 2rem);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: clamp(22px, 4vw, 34px);
      background: linear-gradient(160deg, var(--card-top), var(--card-bottom));
      box-shadow:
        var(--card-shadow),
        var(--card-inset);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      backdrop-filter: blur(18px) saturate(120%);
      animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      width: 84%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--gold-rgb), 0.55), transparent);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0 0 clamp(1.25rem, 3.5vw, 1.9rem);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0;
      padding: 0.42rem 0.85rem;
      border: 1px solid var(--eyebrow-border);
      border-radius: 999px;
      background: var(--eyebrow-bg);
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow .pulse {
      width: 0.46rem;
      height: 0.46rem;
      flex: none;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 0 rgba(var(--gold-rgb), 0.55);
      animation: pulse 2.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), 0.5); }
      70% { box-shadow: 0 0 0 0.42rem rgba(var(--gold-rgb), 0); }
      100% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), 0); }
    }

    .theme-toggle {
      display: inline-grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      flex: none;
      padding: 0;
      border: 1px solid var(--button-border);
      border-radius: 50%;
      background: var(--button-bg);
      color: var(--button-icon);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--button-hover);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .theme-toggle__icon {
      width: 1.1rem;
      height: 1.1rem;
    }

    .theme-toggle__icon--sun {
      display: block;
    }

    .theme-toggle__icon--moon {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle__icon--sun {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle__icon--moon {
      display: block;
    }

    .clock {
      display: block;
      margin: 0;
      padding: 0;
    }

    .analog {
      display: block;
      width: min(100%, 330px);
      aspect-ratio: 1;
      margin: 0 auto clamp(1.15rem, 3vw, 1.5rem);
      border: 1px solid var(--dial-border);
      border-radius: 50%;
      background: var(--dial-bg);
      box-shadow:
        var(--dial-shadow),
        inset 0 1px 0 var(--dial-highlight);
    }

    .analog__dial {
      display: block;
      width: 100%;
      height: 100%;
    }

    .dial-tick {
      stroke: var(--dial-tick);
      stroke-width: 1.6;
      stroke-linecap: round;
    }

    .dial-tick--hour {
      stroke: var(--dial-tick-hour);
      stroke-width: 3.2;
    }

    .dial-number {
      fill: var(--dial-number);
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .hand {
      stroke-linecap: round;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.22));
    }

    .hand--hour {
      stroke: var(--dial-hand);
      stroke-width: 7.5;
    }

    .hand--minute {
      stroke: var(--dial-hand);
      stroke-width: 4.5;
    }

    .hand--second {
      stroke: var(--dial-second);
      stroke-width: 2;
      filter: none;
    }

    .analog__pin {
      fill: var(--dial-pin);
    }

    .analog__pin-inner {
      fill: var(--dial-pin-inner);
    }

    .date {
      margin: 0 0 clamp(0.85rem, 2.4vw, 1.15rem);
      color: var(--soft);
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .zone {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--zone-border);
      border-radius: 999px;
      background: var(--zone-bg);
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .zone strong {
      color: var(--gold-soft);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .zone .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin: clamp(1.25rem, 3.5vw, 1.75rem) 0 0;
    }

    .stat {
      padding: clamp(0.8rem, 2vw, 1.05rem) 0.6rem;
      border: 1px solid var(--stat-border);
      border-radius: 16px;
      background: var(--stat-bg);
    }

    .stat__label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.34rem;
      margin: 0 0 0.42rem;
      color: var(--stat-label);
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat__label svg {
      width: 14px;
      height: 14px;
      color: var(--gold);
      opacity: 0.85;
      flex: none;
    }

    .stat__value {
      margin: 0;
      color: var(--text);
      font-size: clamp(1rem, 3vw, 1.18rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    .meta {
      margin: clamp(1.25rem, 3.5vw, 1.75rem) 0 0;
      padding-top: clamp(0.9rem, 2.4vw, 1.25rem);
      border-top: 1px solid var(--meta-border);
      color: var(--faint);
      font-size: 0.73rem;
      line-height: 1.65;
    }

    .meta p {
      margin: 0;
    }

    .meta strong {
      color: var(--strong-text);
      font-weight: 600;
    }

    .meta .system {
      margin-top: 0.15rem;
    }

    .meta span {
      color: var(--strong-text);
      font-weight: 500;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 560px) {
      .analog {
        width: min(100%, 300px);
      }

      .stats {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.72rem 0.95rem;
        text-align: left;
      }

      .stat__label {
        justify-content: flex-start;
        margin: 0;
      }
    }

    @media (max-width: 360px) {
      .eyebrow__prefix {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>

  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Budapesti időzónás óra</h1>

              <path d="M12 10V2"/><path d="m16 6-4 4-4-4"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="M22 22H2"/><path d="M16 18a4 4 0 0 0-8 0"/>

  <script>
    (() => {
      'use strict';

      const TIME_ZONE = 'Europe/Budapest';
      const LATITUDE = 47.4979;
      const LONGITUDE = 19.0402;
      const RAD = Math.PI / 180;
      const DAY_MS = 86400000;
      const J1970 = 2440588;
      const J2000 = 2451545;
      const OBLIQUITY = RAD * 23.4397;
      const THEME_KEY = 'budapest-clock-theme';
      const THEME_COLORS = { dark: '#05070d', light: '#f4f1ea' };
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const pad2 = (value) => String(value).padStart(2, '0');

      const utcParts = new Intl.DateTimeFormat('en-GB', {
        timeZone: TIME_ZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      });

      const clockParts = new Intl.DateTimeFormat('hu-HU', {
        timeZone: TIME_ZONE,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      });

      const hungarianDate = new Intl.DateTimeFormat('hu-HU', {
        timeZone: TIME_ZONE,
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      });

      const zoneLabel = new Intl.DateTimeFormat('en-GB', {
        timeZone: TIME_ZONE,
        timeZoneName: 'short'
      });

      const sunClock = new Intl.DateTimeFormat('hu-HU', {
        timeZone: TIME_ZONE,
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      });

      const $ = (id) => document.getElementById(id);

      const els = {
        clock: $('clock'),
        date: $('date'),
        zoneAbbr: $('zone-abbr'),
        zoneName: $('zone-name'),
        zoneOffset: $('zone-offset'),
        sunrise: $('sunrise'),
        sunset: $('sunset'),
        daylength: $('daylength'),
        systemZone: $('system-zone'),
        themeToggle: $('theme-toggle'),
        hourHand: $('hand-hour'),
        minuteHand: $('hand-minute'),
        secondHand: $('hand-second')
      };

      const themeColorMeta = document.querySelector('meta[name="theme-color"]');
      const lightScheme = window.matchMedia('(prefers-color-scheme: light)');

      function readStoredTheme() {
        try {
          const value = window.localStorage.getItem(THEME_KEY);
          return value === 'light' || value === 'dark' ? value : null;
        } catch (error) {
          return null;
        }
      }

      function currentTheme() {
        return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      }

      function applyTheme(theme, persist) {
        const isDark = theme === 'dark';
        document.documentElement.dataset.theme = theme;
        els.themeToggle.setAttribute('aria-label', isDark ? 'Világos módra váltás' : 'Sötét módra váltás');
        els.themeToggle.setAttribute('title', isDark ? 'Világos mód' : 'Sötét mód');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
        }
        if (persist) {
          try {
            window.localStorage.setItem(THEME_KEY, theme);
          } catch (error) {
            // Storage can be unavailable (private mode, some file:// setups).
          }
        }
      }

      applyTheme(currentTheme(), false);

      els.themeToggle.addEventListener('click', () => {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
      });

      function handleSystemThemeChange(event) {
        if (!readStoredTheme()) {
          applyTheme(event.matches ? 'light' : 'dark', false);
        }
      }

      if (typeof lightScheme.addEventListener === 'function') {
        lightScheme.addEventListener('change', handleSystemThemeChange);
      } else if (typeof lightScheme.addListener === 'function') {
        lightScheme.addListener(handleSystemThemeChange);
      }

      function buildDial() {
        const tickGroup = $('dial-ticks');
        const numberGroup = $('dial-numbers');

        for (let index = 0; index < 60; index += 1) {
          const isHour = index % 5 === 0;
          const tick = document.createElementNS(SVG_NS, 'line');
          tick.setAttribute('x1', '200');
          tick.setAttribute('y1', isHour ? '14' : '17');
          tick.setAttribute('x2', '200');
          tick.setAttribute('y2', isHour ? '28' : '23');
          tick.setAttribute('transform', 'rotate(' + (index * 6) + ' 200 200)');
          tick.setAttribute('class', isHour ? 'dial-tick dial-tick--hour' : 'dial-tick');
          tickGroup.appendChild(tick);
        }

        for (let number = 1; number <= 12; number += 1) {
          const angle = (number * 30 - 90) * RAD;
          const label = document.createElementNS(SVG_NS, 'text');
          label.setAttribute('x', (200 + Math.cos(angle) * 148).toFixed(2));
          label.setAttribute('y', (200 + Math.sin(angle) * 148).toFixed(2));
          label.setAttribute('text-anchor', 'middle');
          label.setAttribute('dominant-baseline', 'central');
          label.setAttribute('class', 'dial-number');
          label.textContent = String(number);
          numberGroup.appendChild(label);
        }
      }

      function partsMap(formatter, date) {
        const map = {};
        for (const part of formatter.formatToParts(date)) {
          if (part.type !== 'literal') {
            map[part.type] = part.value;
          }
        }
        return map;
      }

      function timeZoneOffsetMinutes(date) {
        const parts = partsMap(utcParts, date);
        const asUtc = Date.UTC(
          Number(parts.year),
          Number(parts.month) - 1,
          Number(parts.day),
          Number(parts.hour),
          Number(parts.minute),
          Number(parts.second)
        );
        return Math.round((asUtc - date.getTime()) / 60000);
      }

      function offsetLabel(minutes) {
        const sign = minutes >= 0 ? '+' : '−';
        const absolute = Math.abs(minutes);
        const hours = Math.floor(absolute / 60);
        const rest = absolute % 60;
        return 'UTC' + sign + hours + (rest ? ':' + pad2(rest) : '');
      }

      function budapestDayKey(date) {
        const parts = partsMap(utcParts, date);
        return parts.year + parts.month + parts.day;
      }

      // SunCalc-style solar position: standard 0.833° horizon refraction.
      const toJulian = (date) => date.valueOf() / DAY_MS - 0.5 + J1970;
      const fromJulian = (julian) => new Date((julian + 0.5 - J1970) * DAY_MS);
      const toDays = (date) => toJulian(date) - J2000;
      const solarMeanAnomaly = (days) => RAD * (357.5291 + 0.98560028 * days);
      const eclipticLongitude = (meanAnomaly) => {
        const center = RAD * (1.9148 * Math.sin(meanAnomaly) + 0.02 * Math.sin(2 * meanAnomaly) + 0.0003 * Math.sin(3 * meanAnomaly));
        return meanAnomaly + center + RAD * 102.9372 + Math.PI;
      };
      const declination = (eclipticLon, eclipticLat) =>
        Math.asin(Math.sin(eclipticLat) * Math.cos(OBLIQUITY) + Math.cos(eclipticLat) * Math.sin(OBLIQUITY) * Math.sin(eclipticLon));

      function sunTimes(date) {
        const lw = RAD * -LONGITUDE;
        const phi = RAD * LATITUDE;
        const days = toDays(date);
        const n = Math.round(days - 0.0009 - lw / (2 * Math.PI));
        const ds = 0.0009 + lw / (2 * Math.PI) + n;
        const meanAnomaly = solarMeanAnomaly(ds);
        const eclipticLon = eclipticLongitude(meanAnomaly);
        const dec = declination(eclipticLon, 0);
        const solarNoon = J2000 + ds + 0.0053 * Math.sin(meanAnomaly) - 0.0069 * Math.sin(2 * eclipticLon);

        const cosHourAngle = (Math.sin(RAD * -0.833) - Math.sin(phi) * Math.sin(dec)) /
          (Math.cos(phi) * Math.cos(dec));

        if (cosHourAngle > 1 || cosHourAngle < -1) {
          return { sunrise: null, sunset: null };
        }

        const hourAngle = Math.acos(cosHourAngle);
        const setJulian = J2000 + (0.0009 + (hourAngle + lw) / (2 * Math.PI) + n) +
          0.0053 * Math.sin(meanAnomaly) - 0.0069 * Math.sin(2 * eclipticLon);
        const riseJulian = solarNoon - (setJulian - solarNoon);

        return {
          sunrise: fromJulian(riseJulian),
          sunset: fromJulian(setJulian)
        };
      }

      function formatDuration(milliseconds) {
        const totalMinutes = Math.round(milliseconds / 60000);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return hours + ' óra ' + pad2(minutes) + ' perc';
      }

      let lastDayKey = null;
      let sun = { sunrise: null, sunset: null };

      function updateSun(date, dayKey) {
        if (dayKey === lastDayKey) {
          return;
        }
        lastDayKey = dayKey;

        const parts = partsMap(utcParts, date);
        const noon = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day), 12));
        sun = sunTimes(noon);

        els.sunrise.textContent = sun.sunrise ? sunClock.format(sun.sunrise) : '—';
        els.sunset.textContent = sun.sunset ? sunClock.format(sun.sunset) : '—';
        els.daylength.textContent = sun.sunrise && sun.sunset
          ? formatDuration(sun.sunset - sun.sunrise)
          : '—';

        if (sun.sunrise) {
          els.sunrise.setAttribute('datetime', sun.sunrise.toISOString());
        }
        if (sun.sunset) {
          els.sunset.setAttribute('datetime', sun.sunset.toISOString());
        }
      }

      function rotateHand(hand, angle) {
        hand.setAttribute('transform', 'rotate(' + angle.toFixed(3) + ' 200 200)');
      }

      function render(date) {
        const parts = partsMap(clockParts, date);
        const hours = Number(parts.hour);
        const minutes = Number(parts.minute);
        const seconds = Number(parts.second);

        rotateHand(els.hourHand, ((hours % 12) + minutes / 60 + seconds / 3600) * 30);
        rotateHand(els.minuteHand, (minutes + seconds / 60) * 6);
        rotateHand(els.secondHand, seconds * 6);

        els.clock.setAttribute('datetime', date.toISOString());
        els.clock.setAttribute('aria-label', 'Budapesti idő: ' +
          hours + ' óra ' + minutes + ' perc ' + seconds + ' másodperc');
        els.date.textContent = hungarianDate.format(date);

        const offset = timeZoneOffsetMinutes(date);
        const abbreviation = partsMap(zoneLabel, date).timeZoneName || 'CET';
        els.zoneAbbr.textContent = abbreviation;
        els.zoneName.textContent = offset === 120 ? 'nyári időszámítás' : 'téli időszámítás';
        els.zoneOffset.textContent = offsetLabel(offset);

        els.systemZone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'helyi időzóna';

        updateSun(date, budapestDayKey(date));
      }

      function scheduleTick() {
        const now = Date.now();
        const delay = 1000 - (now % 1000) + 15;
        window.setTimeout(() => {
          render(new Date());
          scheduleTick();
        }, delay);
      }

      buildDial();
      render(new Date());
      scheduleTick();

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          render(new Date());
        }
      });
    })();
  </script>
</body>
</html>
